<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旅行の数字ききとり</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
html{color-scheme:light}
body{margin:0}
/* Layout: one card. A big round play button is the main object; answer opens below it. Seoul-metro green. */
:root {
  --bg: #f4f6f4;
  --surface: #ffffff;
  --fg: #14211b;
  --muted: #58665f;
  --line: #d3dad5;
  --main: #0b7a57;
  --main-soft: #dcf0e7;
  --main-fg: #ffffff;
  --warm: #b4492f;
  --warm-soft: #fbe6dd;
  --font-jp: 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans CJK JP', sans-serif;
  --font-ko: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans CJK KR', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1713; --surface: #16231d; --fg: #e6efe9; --muted: #98a9a0; --line: #2a3b33;
    --main: #4fc79b; --main-soft: #173a2d; --main-fg: #06160f; --warm: #f08d72; --warm-soft: #44241a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1713; --surface: #16231d; --fg: #e6efe9; --muted: #98a9a0; --line: #2a3b33;
  --main: #4fc79b; --main-soft: #173a2d; --main-fg: #06160f; --warm: #f08d72; --warm-soft: #44241a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-jp); font-size: 16px; line-height: 1.6;
  padding-block: 16px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.ko { font-family: var(--font-ko); }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 1.25rem; margin: 0; font-weight: 700; color: var(--main); }
.stats { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--warm); outline-offset: 2px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 16px; }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.cat { padding: 1px 10px; border-radius: 99px; background: var(--main-soft); color: var(--main); font-weight: 700; }
.listen { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 6px 0 2px; }
.play { width: 112px; height: 112px; border-radius: 50%; border: 0; background: var(--main); color: var(--main-fg); display: grid; place-items: center; box-shadow: 0 6px 0 rgba(0,0,0,.14); }
.play:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.14); }
.play svg { width: 52px; height: 52px; }
.listen .lbl { font-size: .9rem; color: var(--muted); margin: 0; }
.row2 { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.sm { min-height: 44px; padding: 6px 16px; border-radius: 10px; border: 1.5px solid var(--main); background: var(--surface); color: var(--main); font-weight: 700; }
.ans { border: 1.5px solid var(--main); background: var(--main-soft); border-radius: 12px; padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 8px; }
.ans .big { font-size: clamp(1.7rem, 8vw, 2.4rem); font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.ans .big.long { font-size: clamp(1.1rem, 5vw, 1.4rem); }
.ans .note { font-size: .82rem; color: var(--muted); margin: 0; }
.say { display: flex; align-items: center; gap: 10px; border-top: 1px dashed var(--line); padding-top: 10px; }
.say .t { flex: 1; min-width: 0; font-size: 1.1rem; font-weight: 500; line-height: 1.5; overflow-wrap: anywhere; }
.say .t small { display: block; font-size: .72rem; color: var(--muted); font-family: var(--font-jp); font-weight: 400; }
.spk { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid var(--main); background: var(--surface); color: var(--main); display: grid; place-items: center; }
.spk svg { width: 22px; height: 22px; }
.msg { font-size: .82rem; color: var(--warm); background: var(--warm-soft); border-radius: 8px; padding: 8px 10px; margin: 0; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { flex: 1 1 130px; min-height: 52px; border-radius: 12px; border: 1.5px solid var(--main); background: var(--surface); color: var(--main); font-weight: 700; padding: 8px 14px; }
.btn.primary { background: var(--warm); border-color: var(--warm); color: #fff; }
.btn.ok { background: var(--main); border-color: var(--main); color: var(--main-fg); }
.btn.quiet { border-color: var(--line); color: var(--muted); font-weight: 500; }
:root[data-theme="dark"] .btn.primary { color: #1c0b05; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #1c0b05; } }

details.set { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; }
details.set summary { cursor: pointer; padding: 12px 0; font-weight: 700; color: var(--main); }
.set .grid { display: flex; flex-direction: column; gap: 12px; padding-bottom: 14px; }
.set fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; min-width: 0; }
.set legend { font-size: .8rem; color: var(--muted); padding: 0; margin-bottom: 4px; }
.set label { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; }
.set input[type=checkbox], .set input[type=radio] { width: 20px; height: 20px; accent-color: var(--main); }
.set select { font: inherit; min-height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 4px 8px; }
.foot { font-size: .75rem; color: var(--muted); text-align: center; margin: 4px 0 0; }
@media (prefers-reduced-motion: no-preference) { .play, .btn { transition: transform .08s, background-color .15s; } }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>旅行の数字ききとり</h1>
    <div class="stats" id="stats" aria-live="polite"></div>
  </header>

  <main class="card">
    <div class="qhead"><span class="cat" id="cat"></span><span id="qno"></span></div>
    <div class="listen">
      <button class="play" id="play" type="button" aria-label="音声を聞く"></button>
      <p class="lbl" id="lbl">押して、韓国語を聞く</p>
      <div class="row2">
        <button class="sm" id="again" type="button">もう一度</button>
        <button class="sm" id="slow" type="button">ゆっくり</button>
      </div>
    </div>
    <div class="ans" id="ans" hidden>
      <div class="big" id="abig"></div>
      <p class="note" id="anote"></p>
      <div class="say">
        <div class="t ko" id="asay"></div>
        <button class="spk" id="spk" type="button" aria-label="もう一度聞く"></button>
      </div>
    </div>
    <p class="msg" id="novoice" hidden>この端末では韓国語の音声が見つかりませんでした。端末の設定で韓国語の音声を追加すると、音が出ます。</p>
    <div class="actions" id="actions"></div>
  </main>

  <details class="set">
    <summary>出題をえらぶ</summary>
    <div class="grid">
      <fieldset><legend>種類</legend>
        <label><input type="checkbox" id="cWon" checked> 値段（ウォン）</label>
        <label><input type="checkbox" id="cTime" checked> 時刻</label>
        <label><input type="checkbox" id="cDate" checked> 日付</label>
        <label><input type="checkbox" id="cCount" checked> 数え方（本・匹・杯…）</label>
        <label><input type="checkbox" id="cNum" checked> 番号（部屋・バス・出口）</label>
        <label><input type="checkbox" id="cPhone" checked> 電話番号</label>
        <label><input type="checkbox" id="cMix" checked> 会話（組み合わせ）</label>
      </fieldset>
      <fieldset><legend>数の大きさ</legend>
        <label><input type="radio" name="lvl" value="0"> 小さい数</label>
        <label><input type="radio" name="lvl" value="1" checked> ふつう</label>
        <label><input type="radio" name="lvl" value="2"> 大きい数</label>
      </fieldset>
      <fieldset><legend>音声</legend>
        <label><input type="checkbox" id="fAuto" checked> 次の問題で自動で読む</label>
        <label for="fRate">速さ</label>
        <select id="fRate"><option value="0.75">ゆっくり</option><option value="0.9" selected>ふつう</option><option value="1.05">はやい</option></select>
      </fieldset>
    </div>
  </details>
  <p class="foot">問題は毎回、新しく作られます。わからなかった問題は、少しあとにもう一度出ます。</p>
</div>

<script>
/* ================= 韓国語の数の読み ================= */
const DIG = ['영', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
function read4(x) {
  let s = '';
  const th = Math.floor(x / 1000), h = Math.floor(x / 100) % 10, t = Math.floor(x / 10) % 10, o = x % 10;
  if (th) s += (th === 1 ? '' : DIG[th]) + '천';
  if (h) s += (h === 1 ? '' : DIG[h]) + '백';
  if (t) s += (t === 1 ? '' : DIG[t]) + '십';
  if (o) s += DIG[o];
  return s;
}
function sino(n) {                       // 漢数詞
  if (n === 0) return '영';
  const out = [];
  const eok = Math.floor(n / 1e8); n %= 1e8;
  const man = Math.floor(n / 1e4), rest = n % 1e4;
  if (eok) out.push(read4(eok) + '억');
  if (man) out.push(man === 1 && !eok ? '만' : read4(man) + '만');
  if (rest) out.push(read4(rest));
  return out.join(' ');
}
const NAT = ['', '하나', '둘', '셋', '넷', '다섯', '여섯', '일곱', '여덟', '아홉'];
const NTEN = ['', '열', '스물', '서른', '마흔', '쉰', '예순', '일흔', '여든', '아흔'];
const NADN = { 1: '한', 2: '두', 3: '세', 4: '네' };
function nativeAdn(n) {                  // 固有語（助数詞の前の形）
  const t = Math.floor(n / 10), o = n % 10;
  if (o === 0) return t === 2 ? '스무' : NTEN[t];
  return NTEN[t] + (NADN[o] || NAT[o]);
}
function digits(str) { return str.replace(/[^0-9]/g, '').split('').map(c => c === '0' ? '공' : DIG[+c]).join(''); }

/* ================= 乱数・ユーティリティ ================= */
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const yen = n => n.toLocaleString('en-US');
const pad2 = n => String(n).padStart(2, '0');
let LV = 1;

/* ================= 問題の生成 ================= */
const SYS_N = '固有語の数字（한・두・세…）を使う';
const SYS_S = '漢数詞（일・이・삼…）を使う';

function genWon() {
  let a;
  if (LV === 0) a = pick([1000, 1500, 2000, 2500, 3000, 3500, 4000, 4500, 5000, 6000, 7000, 8000, 9000, 10000]);
  else if (LV === 1) a = ri(2, 100) * 500;
  else a = pick([ri(20, 200) * 5000, ri(10, 500) * 1000, ri(100, 1000) * 1000]);
  return { cat: '値段', say: `${sino(a)} 원`, ans: `${yen(a)}ウォン`, note: SYS_S };
}
function timeParts() {
  const pm = Math.random() < 0.5;
  const h = pm ? ri(1, 12) : ri(1, 11);
  let m;
  if (LV === 0) m = pick([0, 30]); else if (LV === 1) m = ri(0, 11) * 5; else m = ri(0, 59);
  return { pm, h, m };
}
function timeSay({ pm, h, m }, withMin = true) {
  const ap = pm ? '오후' : '오전';
  let s = `${ap} ${nativeAdn(h)} 시`;
  if (withMin && m) s += (m === 30 && Math.random() < 0.4) ? ' 반' : ` ${sino(m)} 분`;
  return s;
}
function timeJp({ pm, h, m }) { return `${pm ? '午後' : '午前'}${h}時${m ? m + '分' : ''}`; }
function genTime() {
  const t = timeParts();
  const h24 = t.pm ? (t.h % 12) + 12 : t.h % 12;
  return { cat: '時刻', say: timeSay(t), ans: timeJp(t), note: `時は固有語、分は漢数詞（24時間表記なら ${h24}:${pad2(t.m)}）` };
}
function monthSay(m) { return m === 6 ? '유월' : m === 10 ? '시월' : `${sino(m)} 월`; }
function dateParts() { const m = ri(1, 12); const d = ri(1, m === 2 ? 28 : [4, 6, 9, 11].includes(m) ? 30 : 31); return { m, d }; }
function genDate() {
  const { m, d } = dateParts();
  return { cat: '日付', say: `${monthSay(m)} ${sino(d)} 일`, ans: `${m}月${d}日`, note: '漢数詞。6月は유월、10月は시월と読む' };
}

/* [韓国語, 日本語, 数の種類, [小, ふつう, 大の上限], 刻み] */
const COUNTERS = [
  ['개', '個', 'n', [5, 10, 30]], ['명', '人', 'n', [4, 8, 20]], ['마리', '匹', 'n', [3, 8, 20]],
  ['병', '本（瓶）', 'n', [3, 8, 20]], ['잔', '杯', 'n', [3, 8, 20]], ['장', '枚', 'n', [3, 8, 20]],
  ['권', '冊', 'n', [3, 8, 20]], ['대', '台', 'n', [3, 8, 20]], ['그릇', '杯（器）', 'n', [3, 5, 10]],
  ['줄', '本（キンパ）', 'n', [3, 5, 10]], ['번', '回', 'n', [3, 8, 20]], ['살', '歳', 'n', [30, 50, 90]],
  ['시간', '時間', 'n', [3, 8, 12]],
  ['인분', '人前', 's', [3, 5, 10]], ['분', '分', 's', [30, 60, 90], 5], ['박', '泊', 's', [3, 5, 10]],
  ['층', '階', 's', [5, 10, 30]], ['호선', '号線', 's', [4, 9, 9]], ['번 출구', '番出口', 's', [4, 8, 14]],
  ['도', '度', 's', [20, 30, 40]], ['퍼센트', '％', 's', [30, 70, 100], 10], ['미터', 'メートル', 's', [100, 500, 900], 10],
];
function countSay(n, c, sys) { return `${sys === 'n' ? nativeAdn(n) : sino(n)} ${c}`; }
function genCount() {
  const [c, cj, sys, caps, step] = pick(COUNTERS);
  const cap = caps[LV], st = step || 1;
  const n = ri(1, Math.max(1, Math.floor(cap / st))) * st;
  return { cat: '数え方', say: countSay(n, c, sys), ans: `${n}${cj}`, note: `${c}：${sys === 'n' ? SYS_N : SYS_S}` };
}
function genNumber() {
  const k = pick(['room', 'bus', 'room', 'bus']);
  if (k === 'room') {
    const f = ri(1, [5, 12, 25][LV]), r = ri(1, 20), n = f * 100 + r;
    return { cat: '番号', say: `${sino(n)} 호`, ans: `${n}号室`, note: '部屋番号。漢数詞で、ふつうの数のように読む（302→삼백이）' };
  }
  const n = LV === 0 ? ri(1, 99) : LV === 1 ? ri(10, 500) : ri(100, 999);
  return { cat: '番号', say: `${sino(n)} 번`, ans: `バス${n}番`, note: 'バスの番号。漢数詞で読む' };
}
function genPhone() {
  const a = String(ri(1000, 9999)), b = String(ri(1000, 9999));
  if (LV === 0) return { cat: '電話番号', say: digits(b), ans: b, note: '1桁ずつ読む（0は공）' };
  if (LV === 1) return { cat: '電話番号', say: `${digits(a)}, ${digits(b)}`, ans: `${a}-${b}`, note: '1桁ずつ読む（0は공）' };
  return { cat: '電話番号', say: `공일공, ${digits(a)}, ${digits(b)}`, ans: `010-${a}-${b}`, note: '1桁ずつ読む（0は공）' };
}

const ITEMS = [
  { ko: '맥주', jp: 'ビール', c: '병', cj: '本', s: 'n', up: [4000, 4500, 5000, 6000], max: [3, 6, 12] },
  { ko: '소주', jp: '焼酎', c: '병', cj: '本', s: 'n', up: [4000, 5000], max: [3, 5, 10] },
  { ko: '아메리카노', jp: 'アメリカーノ', c: '잔', cj: '杯', s: 'n', up: [3500, 4000, 4500, 5000], max: [3, 5, 8] },
  { ko: '김밥', jp: 'キンパ', c: '줄', cj: '本', s: 'n', up: [3000, 3500, 4000, 4500], max: [3, 5, 8] },
  { ko: '삼겹살', jp: 'サムギョプサル', c: '인분', cj: '人前', s: 's', up: [14000, 15000, 16000, 18000], max: [3, 5, 8] },
  { ko: '떡볶이', jp: 'トッポッキ', c: '인분', cj: '人前', s: 's', up: [4000, 5000, 6000], max: [2, 4, 6] },
  { ko: '치킨', jp: 'チキン', c: '마리', cj: '羽', s: 'n', up: [18000, 20000, 22000], max: [1, 2, 3] },
  { ko: '호떡', jp: 'ホットク', c: '개', cj: '個', s: 'n', up: [1500, 2000, 2500], max: [3, 5, 10] },
  { ko: '만두', jp: '餃子', c: '개', cj: '個', s: 'n', up: [1000, 1500], max: [4, 8, 15] },
  { ko: '생수', jp: 'お水', c: '병', cj: '本', s: 'n', up: [1000, 1500, 2000], max: [3, 5, 10] },
  { ko: '티켓', jp: 'チケット', c: '장', cj: '枚', s: 'n', up: [10000, 15000, 20000, 25000], max: [2, 4, 6] },
  { ko: '비빔밥', jp: 'ビビンバ', c: '그릇', cj: '杯', s: 'n', up: [9000, 10000, 11000, 12000], max: [2, 4, 5] },
];
function item() {
  const it = pick(ITEMS), n = ri(1, it.max[LV]), up = pick(it.up);
  return { it, n, up, total: n * up, cnt: countSay(n, it.c, it.s), jp: `${it.jp}${n}${it.cj}` };
}
const MIX_NOTE = '会話の中の数字を聞き取る練習';
function genMix() {
  const k = ri(1, 9);
  if (k === 1) { const a = item(); return { cat: '会話', say: `${a.it.ko} ${a.cnt} 주세요.`, ans: `${a.jp}ください`, note: MIX_NOTE }; }
  if (k === 2) { const a = item(); return { cat: '会話', say: `${a.it.ko} ${a.cnt}에 ${sino(a.total)} 원이에요.`, ans: `${a.jp}で${yen(a.total)}ウォンです`, note: MIX_NOTE }; }
  if (k === 3) {
    const a = item(); let b = item(); while (b.it === a.it) b = item();
    return { cat: '会話', say: `${a.it.ko} ${a.cnt}하고 ${b.it.ko} ${b.cnt} 주세요.`, ans: `${a.jp}と${b.jp}ください`, note: MIX_NOTE };
  }
  if (k === 4) {
    const a = item(); let b = item(); while (b.it === a.it) b = item();
    const total = a.total + b.total;
    return { cat: '会話', say: `${a.it.ko} ${a.cnt}하고 ${b.it.ko} ${b.cnt}, 모두 ${sino(total)} 원이에요.`, ans: `${a.jp}と${b.jp}、合計${yen(total)}ウォン`, note: MIX_NOTE };
  }
  if (k === 5) {
    const N = ri(1, LV === 0 ? 3 : 6), f = ri(1, [5, 12, 25][LV]), room = f * 100 + ri(1, 20);
    return { cat: '会話', say: `${sino(N)} 박 ${sino(N + 1)} 일로 예약했어요. 방은 ${sino(room)} 호예요.`, ans: `${N}泊${N + 1}日で予約、${room}号室`, note: MIX_NOTE };
  }
  if (k === 6) {
    const bus = LV === 0 ? ri(1, 99) : ri(10, 600), ex = ri(1, LV === 0 ? 4 : 12);
    return { cat: '会話', say: `${sino(bus)} 번 버스를 타고, ${sino(ex)} 번 출구로 나가세요.`, ans: `バスは${bus}番、出口は${ex}番`, note: MIX_NOTE };
  }
  if (k === 7) {
    const { m, d } = dateParts(), t = timeParts();
    return { cat: '会話', say: `${monthSay(m)} ${sino(d)} 일 ${timeSay(t, false).replace(/ 시$/, ' 시')}에 예약했어요.`, ans: `${m}月${d}日 ${t.pm ? '午後' : '午前'}${t.h}時に予約`, note: MIX_NOTE };
  }
  if (k === 8) {
    const fare = ri(30, 98) * 100, paid = 10000;
    return { cat: '会話', say: `택시비는 ${sino(fare)} 원이에요. 거스름돈은 ${sino(paid - fare)} 원이에요.`, ans: `タクシー代${yen(fare)}ウォン、おつり${yen(paid - fare)}ウォン`, note: MIX_NOTE };
  }
  const age = ri(18, LV === 2 ? 70 : 45), ppl = ri(2, LV === 0 ? 4 : 9);
  return { cat: '会話', say: `저는 ${nativeAdn(age)} 살이고, 일행은 ${nativeAdn(ppl)} 명이에요.`, ans: `私は${age}歳、連れは${ppl}人`, note: MIX_NOTE };
}
const GENS = { cWon: genWon, cTime: genTime, cDate: genDate, cCount: genCount, cNum: genNumber, cPhone: genPhone, cMix: genMix };

/* ================= 音声 ================= */
const $ = id => document.getElementById(id);
let voice = null;
function loadVoice() {
  if (!('speechSynthesis' in window)) return;
  const ko = speechSynthesis.getVoices().filter(v => /^ko/i.test(v.lang));
  voice = ko.find(v => /natural|online/i.test(v.name)) || ko.find(v => /local|heami|sunhi|yuna/i.test(v.name)) || ko[0] || null;
}
if ('speechSynthesis' in window) { loadVoice(); speechSynthesis.addEventListener && speechSynthesis.addEventListener('voiceschanged', loadVoice); }
function say(text, mult) {
  if (!('speechSynthesis' in window)) { $('novoice').hidden = false; return; }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    if (voice) u.voice = voice;
    u.rate = (parseFloat($('fRate').value) || .9) * (mult || 1);
    speechSynthesis.speak(u);
  } catch (e) {}
  if (!voice) loadVoice();
  $('novoice').hidden = !!voice;
}
const SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
$('play').innerHTML = SPK; $('spk').innerHTML = SPK;

/* ================= 出題の流れ ================= */
let cur = null, revealed = false, asked = 0, good = 0, retry = [];
const sel = () => Object.keys(GENS).filter(id => $(id).checked);
function makeQ() {
  LV = +document.querySelector('input[name=lvl]:checked').value;
  const due = retry.findIndex(r => r.due <= asked);
  if (due >= 0) return retry.splice(due, 1)[0].q;
  const ids = sel();
  if (!ids.length) return null;
  return GENS[pick(ids)]();
}
function render() {
  if (!cur) {
    $('cat').textContent = ''; $('qno').textContent = '';
    $('lbl').textContent = '種類を1つ以上えらんでください';
    $('ans').hidden = true; $('actions').innerHTML = ''; return;
  }
  $('cat').textContent = cur.cat;
  $('qno').textContent = `${asked + 1}問目`;
  $('stats').textContent = `わかった ${good}/${asked}`;
  $('lbl').textContent = revealed ? '答え合わせ' : '押して、韓国語を聞く';
  const a = $('ans');
  if (!revealed) {
    a.hidden = true;
    $('actions').innerHTML = '<button class="btn primary" id="bShow" type="button">答えを見る</button>';
    $('bShow').onclick = () => { revealed = true; render(); };
  } else {
    a.hidden = false;
    $('abig').textContent = cur.ans;
    $('abig').className = 'big' + (cur.ans.length > 12 ? ' long' : '');
    $('anote').textContent = cur.note;
    $('asay').textContent = cur.say;
    $('actions').innerHTML = '<button class="btn quiet" id="bNg" type="button">また出して</button><button class="btn ok" id="bOk" type="button">わかった</button>';
    $('bNg').onclick = () => grade(false);
    $('bOk').onclick = () => grade(true);
  }
}
function grade(ok) {
  asked++;
  if (ok) good++; else retry.push({ q: cur, due: asked + 4 });
  next(true);
}
function next(autoplay) {
  try { speechSynthesis.cancel(); } catch (e) {}
  cur = makeQ(); revealed = false; render();
  if (cur && autoplay && $('fAuto').checked) say(cur.say);
}
$('play').onclick = () => cur && say(cur.say);
$('again').onclick = () => cur && say(cur.say);
$('slow').onclick = () => cur && say(cur.say, .65);
$('spk').onclick = () => cur && say(cur.say);
Object.keys(GENS).forEach(id => $(id).addEventListener('change', () => next(false)));
document.querySelectorAll('input[name=lvl]').forEach(r => r.addEventListener('change', () => { retry = []; next(false); }));
next(false);
</script>
